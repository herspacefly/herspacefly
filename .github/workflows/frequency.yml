name: Private frequency

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - 'assets/fonts/**'
      - 'requirements.txt'
      - 'README.md'
      - '.github/workflows/frequency.yml'

permissions:
  contents: write

concurrency:
  group: private-frequency
  cancel-in-progress: false

jobs:
  transmit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tune in
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Prepare Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
      - name: Install the local type engine
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Render the transmission
        run: python scripts/build_art.py
      - name: Check the canvas
        run: python scripts/verify_art.py
      - name: Publish only changed artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/*.svg
          if ! git diff --cached --quiet; then
            git commit -m "art: tune today's private frequency"
            git push
          fi
